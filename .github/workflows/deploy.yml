name: Verifier le build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerer les donnees depuis archives/
        run: |
          pip install openpyxl
          python tools/build_data.py

      - name: Les donnees commitées sont-elles a jour ?
        run: |
          git diff --exit-code -- assets/data/data.js index.html \
            || (echo "::error::data.js/index.html non regeneres : lancez tools/build_data.py puis committez" && exit 1)
